name: Bug report
description: Report something that is not working correctly.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Thanks for reporting a bug. Please use placeholder note text instead of private note content.
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the bug and what you expected to happen.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: List the exact command/settings/input needed to reproduce the issue.
      placeholder: |
        1. Select this text...
        2. Run this command...
        3. See this result...
    validations:
      required: true
  - type: textarea
    id: sample
    attributes:
      label: Sample text
      description: Paste a minimal fake sample that shows the issue.
      render: markdown
  - type: input
    id: plugin-version
    attributes:
      label: Text Alchemy version
      placeholder: 1.1.1
    validations:
      required: true
  - type: input
    id: obsidian-version
    attributes:
      label: Obsidian version
      placeholder: 1.5.0 or newer
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Desktop
        - Mobile
        - Both
    validations:
      required: true
