name: Feature request
description: Suggest a new cleanup, spacing, sorting, or list tool.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: idea
    attributes:
      label: What should Text Alchemy do?
      description: Describe the command or setting you want.
    validations:
      required: true
  - type: textarea
    id: example
    attributes:
      label: Example input and output
      description: Show a small before/after example.
      placeholder: |
        Before:
        Milk
        Cheese

        After:
        [[Milk]]
        [[Cheese]]
      render: markdown
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Extra notes
      description: Mention any edge cases, settings, or commands this should interact with.
